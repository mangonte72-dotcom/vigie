<style>
/* Layout: one phone-width column, content cards on a cool ground, fixed bottom tab bar with a raised Scanner button. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --line:#E3E8EF; --line-strong:#C5CEDA;
  --fg:#0F1B2D; --muted:#566578;
  --accent:#1A4FE0; --accent-fg:#FFFFFF; --accent-soft:#E8EEFF; --accent-ink:#123AA8;
  --danger:#D92D20; --danger-on:#FFFFFF; --danger-soft:#FEECEB; --danger-ink:#A3170F;
  --high-soft:#FFE6D5; --high-ink:#8A3300; --warn-soft:#FFF4D6; --warn-ink:#7A4B00;
  --ok:#17663A; --ok-on:#FFFFFF; --ok-soft:#E3F5EA; --ok-ink:#17663A;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 6px 18px rgba(15,27,45,.05);
  --display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1320; --surface:#141D2C; --surface-2:#1B2638; --line:#263247; --line-strong:#3A4860;
  --fg:#E8EDF5; --muted:#9AA8BC;
  --accent:#7A9DFF; --accent-fg:#0C1320; --accent-soft:#1C2A4D; --accent-ink:#B4C8FF;
  --danger:#F0574B; --danger-on:#1A0705; --danger-soft:#3A1A1A; --danger-ink:#FFB4AC;
  --high-soft:#3D2414; --high-ink:#FFBE8F; --warn-soft:#3A2E10; --warn-ink:#F5D07A;
  --ok:#44C07A; --ok-on:#06170D; --ok-soft:#14301F; --ok-ink:#8FDBA9;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1320; --surface:#141D2C; --surface-2:#1B2638; --line:#263247; --line-strong:#3A4860;
  --fg:#E8EDF5; --muted:#9AA8BC;
  --accent:#7A9DFF; --accent-fg:#0C1320; --accent-soft:#1C2A4D; --accent-ink:#B4C8FF;
  --danger:#F0574B; --danger-on:#1A0705; --danger-soft:#3A1A1A; --danger-ink:#FFB4AC;
  --high-soft:#3D2414; --high-ink:#FFBE8F; --warn-soft:#3A2E10; --warn-ink:#F5D07A;
  --ok:#44C07A; --ok-on:#06170D; --ok-soft:#14301F; --ok-ink:#8FDBA9;
  --shadow:none; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800;line-height:1.15}
h2{font-size:17px;font-weight:800}
h3{font-size:15px;font-weight:700}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:0 0 auto}
.brand b{font-family:var(--display);font-size:18px;font-weight:800;display:block}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);text-decoration:none;flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;text-decoration:none;color:inherit;background:none;border:0;width:100%;text-align:left}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row strong{font-size:14px;line-height:1.3}
.score{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.lv-crit{background:var(--danger);color:var(--danger-on)}
.lv-high{background:var(--high-soft);color:var(--high-ink)}
.lv-mod{background:var(--warn-soft);color:var(--warn-ink)}
.lv-low{background:var(--ok-soft);color:var(--ok-ink)}
.lv-done{background:var(--surface-2);color:var(--muted)}
.lv-info{background:var(--accent-soft);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-inline:-2px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;flex:0 0 auto}
.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.chip.red[aria-pressed="true"]{border-color:var(--danger);background:var(--danger-soft);color:var(--danger-ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{min-height:40px;border:0;border-radius:10px;background:transparent;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(15,27,45,.12)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-on)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-on)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.label{font-size:14px;font-weight:600}
.input{min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;width:100%}
textarea.input{padding:12px;min-height:96px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid4 .chip{padding:0 4px;white-space:normal;line-height:1.15;min-height:44px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);line-height:1.3}
.action{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:110px;text-decoration:none;color:var(--fg)}
.action .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.action strong{font-size:15px;display:block}
.action small{font-size:12px;color:var(--muted)}
.sos-card{display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;background:var(--danger);color:var(--danger-on);text-decoration:none}
.sos-card .dot{flex:0 0 auto;width:62px;height:62px;border-radius:999px;background:var(--danger-on);color:var(--danger);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.sos-card b{font-family:var(--display);font-size:18px;display:block}
.alert{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--danger);color:var(--danger-on)}
.alert .acts{display:flex;flex-wrap:wrap;gap:8px}
.alert .btn{background:var(--danger-on);color:var(--danger);border-color:transparent}
.note{border-radius:14px;padding:12px 14px;font-size:14px}
.note.ok{background:var(--ok-soft);color:var(--ok-ink)}
.note.info{background:var(--accent-soft);color:var(--accent-ink)}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.err{background:var(--danger-soft);color:var(--danger-ink)}
.redbox{background:var(--danger-soft);border-radius:16px;padding:14px 16px}
.redbox h3{color:var(--danger-ink)}
ol,ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
li{font-size:14px}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:14px;background:var(--surface-2);display:block}
.drop{min-height:120px;border-radius:16px;border:2px dashed var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;cursor:pointer;text-align:center;padding:10px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.check{min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:14px}
.check .box{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.check[aria-checked="true"]{background:var(--ok-soft);border-color:transparent}
.check[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--ok-on)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.hold{position:relative;width:220px;height:220px;border-radius:999px;border:0;background:var(--danger);color:var(--danger-on);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:18px auto;box-shadow:0 0 0 14px var(--danger-soft);touch-action:none;user-select:none;-webkit-user-select:none}
.hold b{font-family:var(--display);font-size:46px;font-weight:800;letter-spacing:.04em}
.hold svg.ring{position:absolute;inset:-14px;width:248px;height:248px;transform:rotate(-90deg);pointer-events:none}
.hold svg.ring circle{fill:none;stroke:var(--fg);stroke-width:6;stroke-dasharray:747;stroke-dashoffset:747}
.hold.holding svg.ring circle{transition:stroke-dashoffset 1.5s linear;stroke-dashoffset:0}
.numrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:64px}
.numrow .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--danger);font-variant-numeric:tabular-nums;user-select:all}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;text-decoration:none;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.tab .fab{width:54px;height:54px;margin-top:-24px;border-radius:999px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 8px 18px rgba(26,79,224,.35)}
.qr{width:96px;height:96px;image-rendering:pixelated;border-radius:8px;background:#FFFFFF;padding:6px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.sep{height:1px;background:var(--line)}
.hier .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:0 0 auto}
.slideimg{display:block;width:100%;aspect-ratio:16/9;max-width:100%;object-fit:cover;border-radius:14px;background:var(--surface-2);box-shadow:var(--shadow)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots button{width:28px;height:28px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);padding:0}
.dots button[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stopcard{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:22px;background:#F2B705;color:#111A2B;text-decoration:none}
.stopcard .oct{flex:0 0 auto;width:58px;height:58px;display:grid;place-items:center}
.stopcard b{font-family:var(--display);font-size:18px;display:block}
.tracker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.tracker span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;line-height:1.15;text-align:center;color:var(--muted)}
.tracker i{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:var(--surface-2);color:var(--muted);border:2px solid var(--line-strong)}
.tracker .done i{background:var(--ok);color:var(--ok-on);border-color:var(--ok)}
.tracker .next i{border-color:var(--accent);color:var(--accent)}
.tracker .done{color:var(--fg)}
.present{position:fixed;inset:0;z-index:60;background:#0B111C;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.present img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain}
.present .bar2{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;color:#E8EDF5;font-size:14px}
.present .bar2 button{min-height:44px;min-width:44px;border-radius:12px;border:1px solid #3A4860;background:#141D2C;color:#E8EDF5;font-weight:600;padding:0 14px}
.present .zone{position:absolute;top:0;bottom:64px;width:40%;background:transparent;border:0}
@media (prefers-reduced-motion: reduce){.hold.holding svg.ring circle{transition:none}}
</style>

const SLIDES = [{"sec": "Vigie · Formation sécurité", "title": "Droit d’arrêt de travail", "pts": ["Stop Work Authority : chacun a le pouvoir d’arrêter un travail dangereux, à tout moment.", "Sensibilisation HSE pour tous les personnels, sous-traitants inclus."], "note": "Bonjour à toutes et à tous. Aujourd'hui, nous parlons d'un outil simple mais essentiel : le droit d'arrêt de travail, ou « Stop Work Authority ». L'idée est la suivante : chaque personne présente sur le site, quel que soit son poste ou son ancienneté, a le droit — et le devoir — d'arrêter un travail qu'elle juge dangereux. À la fin de cette session, vous saurez ce qu'est ce droit, qui peut l'exercer, quand l'utiliser et comment le faire concrètement.", "img": "slides/slide-01.jpg"}, {"sec": "01 · Comprendre", "title": "Qu’est-ce que le droit d’arrêt de travail ?", "pts": ["Il donne à chaque salarié le droit de faire cesser immédiatement un travail dangereux.", "Il s’utilise dès qu’on perçoit une condition ou un comportement dangereux pouvant mener à un événement indésirable.", "C’est l’occasion de corriger un danger et de stopper un acte à risque avant qu’il ne provoque un accident.", "Parfois, le travail le plus important que vous puissiez faire… c’est d’arrêter de travailler."], "note": "Alors, qu'est-ce que le droit d'arrêt de travail, exactement ? C'est le droit donné à chaque salarié d'arrêter un travail qu'il estime dangereux. On l'utilise chaque fois qu'on perçoit une condition dangereuse ou un comportement à risque qui pourrait entraîner un événement indésirable, et chaque fois qu'on est sincèrement inquiet pour sa propre santé ou sa sécurité, ou pour celle des autres. Faire un « Stop » est l'occasion de corriger un danger et de stopper un acte à risque AVANT qu'il ne se produise. Si vous voyez quelque chose qui vous paraît réellement dangereux, ou un comportement à risque en cours, souvenez-vous : parfois, le travail le plus important que vous puissiez faire, c'est d'arrêter de travailler.", "img": "slides/slide-02.jpg"}, {"sec": "01 · Comprendre", "title": "Qui peut arrêter le travail ? Tout le monde.", "pts": ["Vous, quel que soit votre poste ou votre ancienneté.", "Vos collègues, au sein de votre équipe comme des autres.", "Les sous-traitants : entreprises extérieures et intérimaires.", "L’encadrement : chefs d’équipe, superviseurs et managers.", "Les équipes terrain : exploitation, maintenance, travaux sur site.", "Les fonctions support : bureaux, services administratifs, visiteurs.", "Personne ne sera jamais sanctionné pour avoir arrêté un travail par souci de sécurité."], "note": "Qui peut exercer le droit d'arrêt de travail ? La réponse est très simple : tout le monde. Vous, vos collègues, les entreprises extérieures et les intérimaires, votre chef d'équipe ou votre manager, que vous travailliez en exploitation, sur le terrain ou dans un bureau. Nous avons tous le droit d'arrêter un travail pour la sécurité, et personne ne sera sanctionné pour l'avoir fait. Un « Stop » ne prend souvent que quelques minutes : par exemple, si vous voyez quelqu'un sur le point de se blesser, c'est le bon moment pour s'arrêter et lui proposer votre aide. Point de repère pour la France : ce droit d'arrêt interne complète le droit d'alerte et de retrait prévu par le Code du travail (articles L4131-1 et suivants), qui permet à tout salarié de se retirer d'une situation présentant un danger grave et imminent, sans sanction ni retenue de salaire. [À valider avec le service HSE / juridique du site.]", "img": "slides/slide-03.jpg"}, {"sec": "01 · Comprendre", "title": "Quand utiliser mon droit d’arrêt ?", "pts": ["Dès qu’une situation menace les personnes, les équipements ou l’environnement. Par exemple :", "Changement de périmètre ou de mode opératoire", "Changement des conditions (météo, atmosphère…)", "Situation d’urgence", "Équipement mal utilisé", "Manque de connaissances, de compréhension ou d’information", "Presque-accident, condition dangereuse, acte dangereux, déclenchement d’une alarme", "Un risque de blessure ? Ne l’ignorez pas : STOP, et sécurisez."], "note": "Quand faut-il utiliser son droit d'arrêt ? Chaque fois que l'on constate des conditions qui menacent les personnes, les équipements ou l'environnement. Quelques exemples. Un changement de périmètre ou de mode opératoire : par exemple, une tâche déplacée temporairement dans une autre zone, ou un outil différent de celui prévu. Un changement de conditions : si vous conduisez et qu'une tempête de neige survient, la route devient dangereuse — sur site, c'est la même chose avec le vent, la chaleur ou une atmosphère qui évolue. Une situation d'urgence : un incendie, un événement météo violent, ou un collègue qui fait un malaise pendant le travail. Un équipement mal utilisé : un outil employé pour un usage auquel il n'est pas destiné. Un manque de connaissances ou d'information : par exemple, quelqu'un qui débute à un poste et n'est pas sûr de la marche à suivre. Et bien sûr les presque-accidents, les conditions dangereuses, les actes dangereux et les alarmes. Retenez : dès qu'il y a un risque que quelque chose ou quelqu'un soit blessé, ne l'ignorez pas. Arrêtez, et assurez-vous que c'est sûr.", "img": "slides/slide-04.jpg"}, {"sec": "02 · Agir", "title": "Arrêter un comportement à risque", "pts": ["1. Une procédure mal suivie ou un geste à risque ? Prenez l’initiative : demandez une pause.", "2. Échangez avec votre collègue pour que chacun connaisse la façon sûre de continuer.", "Comportements à danger imminent : travail en hauteur sans protection antichute, travail par point chaud près de matières inflammables, non-respect de la consignation (cadenassage), entrée non conforme en espace confiné, passage ou stationnement sous une charge levée, EPI inadaptés ou non portés."], "note": "Parfois, ce n'est pas une situation qui est dangereuse, c'est un comportement. Quand vous voyez une procédure qui n'est pas correctement suivie, ou un comportement à risque en cours, prenez l'initiative et demandez une courte pause. Puis parlez avec votre collègue : dites-lui que votre objectif est de veiller sur lui, pour qu'il rentre chez lui en bonne santé — et assurez-vous que tout le monde connaît la façon sûre de continuer. Exemples de comportements qui exposent à un danger imminent : travailler en hauteur sans protection antichute ; réaliser un travail par point chaud près de matières inflammables ; ne pas respecter la consignation des énergies (cadenassage) ; entrer dans un espace confiné sans respecter la procédure ; passer ou stationner sous une charge levée ; ne pas porter les EPI adaptés. Un mot pour les nouveaux arrivants : si vous débutez au poste, vous avez exactement le même droit d'arrêter — et c'est souvent vous qui voyez ce que les autres ne voient plus.", "img": "slides/slide-05.jpg"}, {"sec": "02 · Agir · Ne comptez pas sur les autres", "title": "Je vois. J’agis. STOP !", "pts": ["Prendre la parole peut sauver une vie.", "On vous demande d’arrêter ? Arrêtez immédiatement.", "Vos collègues veulent vous protéger. La sécurité est l’affaire de tous."], "note": "Chacun d'entre nous a le droit, et le devoir, d'exercer son droit d'arrêt. Ne partez pas du principe que quelqu'un d'autre va s'en occuper. Retenez trois mots : je vois, j'agis, STOP ! Il est facile de se dire « ce n'est pas à moi de dire aux autres quoi faire » ou « ils savent sûrement ce qu'ils font, qui suis-je pour les arrêter ? ». Pourtant, vous pourriez sauver la vie de quelqu'un en prenant la parole et en arrêtant le travail pour la sécurité. Et l'inverse est vrai : si quelqu'un vous demande d'arrêter, vous devez arrêter le travail immédiatement. Vos collègues ne cherchent pas à vous punir, ils cherchent à vous protéger. La sécurité est l'affaire de tous.", "img": "slides/slide-06.jpg"}, {"sec": "02 · Agir", "title": "Comment exercer le droit d’arrêt ? 6 étapes", "pts": ["1. Arrêter le travail : stopper l’activité et mettre la zone en sécurité.", "2. Prévenir le superviseur, et toute personne exposée au danger.", "3. Analyser la situation : ensemble, comprendre le risque et ses causes.", "4. Corriger le problème : inspection par des personnes qualifiées, actions correctives.", "5. Reprendre le travail : seulement quand la situation est sûre pour tous.", "6. Assurer le suivi : partager le retour d’expérience pour éviter la récidive."], "note": "Comment utilise-t-on concrètement le droit d'arrêt ? Si le problème est simple, on arrête, on corrige et on reprend. Mais si le problème est plus compliqué — si vous ne pouvez pas le résoudre immédiatement ou s'il vous faut de l'aide — voici les étapes. Côté personne qui arrête le travail : un, arrêter le travail et sécuriser la zone. Deux, prévenir votre superviseur ou votre manager, ainsi que toute personne qui pourrait être exposée à la situation dangereuse. Trois, analyser la situation : vous, les autres personnes concernées et le superviseur discutez ensemble du danger et de ses causes. Ensuite interviennent les personnes qui traitent le problème. Quatre, corriger : en général, la zone est inspectée par des personnes qualifiées — encadrement, HSE, maintenance — qui définissent les actions correctives. Cinq, reprendre le travail, uniquement quand la situation est redevenue sûre pour tout le monde. Six, assurer le suivi : on enregistre l'arrêt, on partage le retour d'expérience et on vérifie que les mesures tiennent dans la durée. [Adapter au circuit de remontée propre au site.]", "img": "slides/slide-07.jpg"}, {"sec": "03 · Lever les freins", "title": "Pourquoi n’ose-t-on pas arrêter le travail ?", "pts": ["La perception : « Je ne vois pas le danger. » « Le risque ne me semble pas assez grave. »", "La compréhension : « Je n’ai pas l’autorité pour intervenir dans cette situation. »", "La relation avec l’équipe : « Je ne veux pas froisser un collègue. » « Le groupe me pousse à me taire. » « J’ai peur de me tromper et d’être ridicule. »", "La relation avec la hiérarchie : « Je crains des conséquences si l’arrêt pénalise la production. »"], "note": "Parlons franchement des raisons pour lesquelles on n'utilise pas son droit d'arrêt. D'abord, la perception. On ne perçoit pas toujours la situation comme dangereuse : on a déjà fait la même chose de la même façon, et rien ne s'est passé. Mais si c'était simplement de la chance ? On peut aussi penser que le risque n'est pas assez grave pour justifier un arrêt, surtout quand on a presque fini. Sachez pourtant qu'arrêter le travail ne veut pas forcément dire arrêter l'unité ou le site entier : la plupart du temps, un arrêt se règle en quelques minutes. Ensuite, la compréhension : on peut croire qu'on n'a pas l'autorité pour intervenir. Comme on l'a vu, tout le monde l'a. Puis la relation avec l'équipe : on ne veut pas froisser un collègue, on ressent la pression du groupe, ou on a peur de mal interpréter la situation et d'être ridicule. Enfin la relation avec la hiérarchie : on craint des conséquences si l'arrêt impacte la production. Notre message est clair : personne ne sera sanctionné pour un arrêt fait de bonne foi pour la sécurité. Question pour la salle : lequel de ces freins avez-vous déjà ressenti ?", "img": "slides/slide-08.jpg"}, {"sec": "03 · Retenir", "title": "L’essentiel à retenir", "pts": ["1. Restez attentif à votre environnement, en permanence.", "2. Pensez aux dangers possibles de chaque tâche.", "3. Danger imminent ? Arrêtez le travail.", "4. Prévenez votre superviseur.", "5. Expliquez le danger que vous percevez.", "6. Le superviseur traite le problème avec vous.", "Danger imminent : toute condition, action ou pratique présentant un danger qui pourrait raisonnablement causer un dommage physique."], "note": "Récapitulons. Un : restez attentif à votre environnement en permanence — gardez l'œil ouvert sur tout danger qui pourrait vous toucher, vous ou vos collègues. Deux : pensez aux dangers possibles de chaque tâche, surtout quand vous faites quelque chose de nouveau ou de différent de d'habitude. Prenez cinq minutes : qu'est-ce qui pourrait mal tourner ? Est-ce que cela peut blesser quelqu'un ou avoir un impact sur l'environnement ? Trois : si vous percevez un danger imminent, arrêtez le travail. Un danger imminent, c'est toute condition, action ou pratique présentant un danger qui pourrait raisonnablement causer un dommage physique. Par exemple, un objet au sol sur lequel quelqu'un pourrait trébucher : il suffit d'une minute pour s'arrêter et le signaler. Demandez-vous : si je fais ça, que peut-il arriver — à moi, à vous, à l'équipe ? Si la réponse peut être une blessure, on arrête. Ensuite : quatre, prévenez votre superviseur ; cinq, expliquez le danger perçu ; six, le superviseur traite le problème avec vous.", "img": "slides/slide-09.jpg"}, {"sec": "En résumé", "title": "Repérer. Arrêter. Signaler.", "pts": ["Repérer : je reste attentif et j’identifie le danger.", "Arrêter : j’utilise mon droit d’arrêt, sans hésiter.", "Signaler : je préviens et je participe à la solution.", "Dans le doute, on s’arrête."], "note": "Pour conclure, trois verbes à garder en tête : repérer, arrêter, signaler. Repérer : je reste attentif à mon environnement et j'identifie les dangers. Arrêter : j'utilise mon droit d'arrêt sans hésiter, quel que soit mon poste. Signaler : je préviens mon superviseur et je participe à la recherche de solution. Et si vous ne deviez retenir qu'une phrase : dans le doute, on s'arrête. Merci de votre attention — avez-vous des questions ou des situations vécues que vous aimeriez partager ?", "img": "slides/slide-10.jpg"}];

 permis() {

   <div class="field"><label for="pEq">Équipement</label><select class="input" id="pEq" data-bind="permitEquip"><option value="">Non précisé</option>${S.equip.map(e => `<option value="${esc(e.code)}" ${eqCode === e.code ? 'selected' : ''}>${esc(e.nom)}</option>`).join('')}</select></div>
   <div class="card stack-s"><div class="top"><strong>${P.title}</strong><span style="font-family:var(--display);font-weight:800;color:var(--accent)">${done} / ${P.items.length}</span></div><div class="bar"><i style="width:${Math.round(done / P.items.length * 100)}%;${all ? 'background:var(--ok)' : ''}"></i></div></div>
   <div class="stack-s">${P.items.map((it, i) => `<button class="check" role="checkbox" aria-checked="${!!ck[i]}" data-act="ck" data-v="${i}"><span class="box">${svg('check',16,3)}</span><span style="flex:1">${esc(it)}</span></button>`).join('')}</div>
   ${ui.permitMsg ? `<div class="note ok" role="status">${esc(ui.permitMsg)}</div>` : ''}
   <button class="btn block ${all ? 'ok' : ''}" data-act="permit-ok" ${all ? '' : 'disabled'}>${all ? 'Autoriser le démarrage' : 'Cochez tous les points (' + (P.items.length - done) + ' restant' + (P.items.length - done > 1 ? 's' : '') + ')'}</button>
   <span class="tiny muted">Aide à la vérification : ne remplace pas le permis signé selon les procédures du site.</span>
   <div class="stack-s"><h2>Permis actifs</h2><div class="card flush list">${act.length ? act.map(p => `<div class="row"><span class="score lv-low">${svg('clip',18)}</span><span class="grow"><strong>${esc(PERMITS[p.kind] ? PERMITS[p.kind].title : p.kind)}${p.equipName ? ' · ' + esc(p.equipName) : ''}</strong><span class="tiny muted">${esc(dmy(p.at))} ${esc(hhmm(p.at))} · <span data-uid="${esc(p.by || '')}">…</span></span></span><button class="btn sm" data-act="permit-close" data-id="${esc(p.id)}">Clore</button></div>`).join('') : '<div class="empty">Aucun permis actif.</div>'}</div></div>`;
 },

 solutions() {
  const d = DM[ui.sol];
  const H = [['1','Supprimer le danger',d.e,'var(--ok-soft)','var(--ok-ink)'],['2','Protection collective',d.c,'var(--accent-soft)','var(--accent-ink)'],['3','Organisation et formation',d.o,'var(--warn-soft)','var(--warn-ink)'],['4','EPI (dernier recours)',d.p,'var(--high-soft)','var(--high-ink)']];

   <div class="chips scroll">${D.map(x => `<button class="chip" aria-pressed="${ui.sol === x.id}" data-act="sol" data-v="${x.id}">${x.label}</button>`).join('')}</div>
   <div class="card stack-s" style="background:var(--accent);color:var(--accent-fg);border:0"><h2 style="font-size:21px">${esc(d.label)}</h2><span class="small">${esc(d.ex)}</span><span class="small"><strong>Permis :</strong> ${esc(d.permis)}</span><span class="small"><strong>Référence :</strong> ${esc(d.ref)}</span></div>
   ${H.map(([n, t, items, bg, fg]) => `<div class="card stack-s hier"><div style="display:flex;align-items:center;gap:10px"><span class="n" style="background:${bg};color:${fg}">${n}</span><h3>${t}</h3></div><ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}

 urgences() {

 },

 formation() {
  const n = SLIDES.length, i = Math.min(ui.slide, n), myForm = S.formation.find(f => f.id === S.me.id);
  if (i === n) return quizView(myForm);
  const s = SLIDES[i];
  return `${backLink('#accueil', 'Formation : droit d’arrêt', 'Diapositive ' + (i + 1) + ' sur ' + n)}

   <a href="${s.img}" target="_blank" rel="noopener" aria-label="Agrandir la diapositive ${i + 1}"><img class="slideimg" src="${s.img}" alt="Diapositive ${i + 1} : ${esc(s.title)}"></a>
   <div class="dots" role="group" aria-label="Choisir une diapositive">${SLIDES.map((_, k) => `<button data-act="slide-go" data-v="${k}" aria-current="${k === i}" aria-label="Diapositive ${k + 1}">${k + 1}</button>`).join('')}<button data-act="slide-go" data-v="${n}" aria-label="Quiz" style="width:auto;padding:0 10px">Quiz</button></div>

   <details class="card" data-notes ${ui.notesOpen ? 'open' : ''}><summary style="font-weight:600;cursor:pointer;min-height:28px">Notes de l’animateur</summary><p class="small" style="margin:10px 0 0;line-height:1.55">${esc(s.note)}</p></details>
   <div class="grid2"><button class="btn" data-act="slide-prev" ${i === 0 ? 'disabled' : ''}>← Précédente</button><button class="btn primary" data-act="slide-next">${i === n - 1 ? 'Passer le quiz →' : 'Suivante →'}</button></div>
   <button class="btn block" data-act="present">Mode présentation (réunion, écran)</button>

 },

 stop() {
  const d = ui.stop, open = S.stops.filter(s => s.status !== 'clos'), closed = S.stops.filter(s => s.status === 'clos').slice(0, 5);
  return `${backLink('#accueil', 'Droit d’arrêt de travail', 'Je vois. J’agis. STOP !')}
   <div class="note warn small"><strong>Personne ne sera jamais sanctionné</strong> pour avoir arrêté un travail par souci de sécurité. Dans le doute, on s’arrête.</div>
   ${ui.stopMsg ? `<div class="note ok" role="status">${esc(ui.stopMsg)}</div>` : ''}
   <div class="card stack"><h2>J’arrête un travail</h2>
    <div class="note info small"><strong>D’abord :</strong> arrêtez l’activité et mettez la zone en sécurité. Danger grave et imminent ? Utilisez plutôt le <a href="#sos">SOS</a>.</div>
    <div class="stack-s"><span class="label">Pourquoi ?</span><div class="chips">${STOP_M.map(m => `<button class="chip" style="white-space:normal;text-align:left;line-height:1.25;padding-block:8px" aria-pressed="${d.motif === m}" data-act="stop-motif" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div></div>
    <div class="field"><label for="stopLieu">Où ?</label><input class="input" id="stopLieu" data-bind="stop.lieu" value="${esc(d.lieu || (lastEquip ? lastEquip.nom : ''))}" placeholder="Ex. : Rack 3, unité de distillation"></div>
    <div class="field"><label for="stopDesc">Le danger que je perçois</label><textarea class="input" id="stopDesc" data-bind="stop.desc" placeholder="Ex. : soudure prévue à 2 m d’un égout non obturé">${esc(d.desc)}</textarea><span class="tiny muted">Pour dicter, utilisez le micro du clavier.</span></div>
    <button class="check" role="checkbox" aria-checked="${d.told}" data-act="stop-told"><span class="box">${svg('check',16,3)}</span><span style="flex:1">J’ai déjà prévenu mon superviseur et les personnes exposées</span></button>
    ${ui.stopErr ? `<div class="note err small">${esc(ui.stopErr)}</div>` : ''}
    <button class="btn block" style="background:#F2B705;border-color:#F2B705;color:#111A2B" data-act="stop-send" ${ui.stopBusy ? 'disabled' : ''}>${ui.stopBusy ? 'Enregistrement…' : 'Enregistrer l’arrêt'}</button></div>

   ${closed.length ? `<div class="stack-s"><h2>Arrêts clos récemment</h2>${closed.map(stopCard).join('')}</div>` : ''}`;
 },

 reglages() {
  if (!S.canEdit) return `${backLink('#accueil', 'Réglages')}<div class="card stack-s"><strong>Réservé au service HSE</strong><span class="small muted">Les réglages du site et la liste des équipements sont modifiables par les personnes qui ont le rôle HSE dans Vigie.</span></div>${accountSection()}`;
  const c = ui.cfgDraft || (ui.cfgDraft = { siteName: S.cfg.siteName || '', poste: S.cfg.poste || '', rassemblement: S.cfg.rassemblement || '' });
  const q = ui.eq;
  return `${backLink('#accueil', 'Réglages du site')}
   <div class="card stack"><h2>Informations du site</h2>
    <div class="field"><label for="cName">Nom du site</label><input class="input" id="cName" data-bind="cfgDraft.siteName" value="${esc(c.siteName)}" placeholder="Ex. : Raffinerie de [VILLE]"></div>
    <div class="field"><label for="cPoste">Numéro du poste de garde</label><input class="input" id="cPoste" data-bind="cfgDraft.poste" value="${esc(c.poste)}" inputmode="tel" placeholder="Ex. : 04 42 00 00 00 ou 2222"></div>
    <div class="field"><label for="cRas">Point de rassemblement</label><input class="input" id="cRas" data-bind="cfgDraft.rassemblement" value="${esc(c.rassemblement)}" placeholder="Ex. : Parking nord, point R2"></div>
    ${ui.cfgMsg ? `<div class="note ok small" role="status">${esc(ui.cfgMsg)}</div>` : ''}
    <button class="btn primary" data-act="cfg-save">Enregistrer</button></div>
   <div class="card stack"><h2>${q._edit ? 'Modifier l’équipement ' + esc(q.code) : 'Ajouter un équipement'}</h2>
    <div class="grid2"><div class="field"><label for="eCode">Code</label><input class="input" id="eCode" data-bind="eq.code" value="${esc(q.code)}" placeholder="B12" ${q._edit ? 'readonly' : ''}></div><div class="field"><label for="eNom">Nom</label><input class="input" id="eNom" data-bind="eq.nom" value="${esc(q.nom)}" placeholder="Bac B12"></div></div>
    <div class="grid2"><div class="field"><label for="eZone">Zone</label><input class="input" id="eZone" data-bind="eq.zone" value="${esc(q.zone)}" placeholder="Parc de stockage"></div><div class="field"><label for="eProd">Produit</label><input class="input" id="eProd" data-bind="eq.produit" value="${esc(q.produit)}" placeholder="Brut léger"></div></div>
    <div class="field"><label for="eTags">Dangers signalés (séparés par des virgules)</label><input class="input" id="eTags" data-bind="eq.tags" value="${esc(q.tags)}" placeholder="Zone ATEX 1, H₂S possible, Espace confiné"></div>
    <div class="field"><label for="eCons">Consignes avant intervention (une par ligne)</label><textarea class="input" id="eCons" data-bind="eq.consignes">${esc(q.consignes)}</textarea></div>
    <div class="field"><label for="ePerm">Permis requis</label><input class="input" id="ePerm" data-bind="eq.permis" value="${esc(q.permis)}" placeholder="Permis de pénétrer + bon de consignation"></div>
    ${ui.eqMsg ? `<div class="note ${ui.eqMsg.startsWith('✓') ? 'ok' : 'err'} small" role="status">${esc(ui.eqMsg.replace('✓ ', ''))}</div>` : ''}
    <div class="chips"><button class="btn primary" data-act="eq-save">${q._edit ? 'Enregistrer' : 'Ajouter l’équipement'}</button>${q._edit ? '<button class="btn" data-act="eq-cancel">Annuler</button>' : ''}</div></div>
   <div class="stack-s"><h2>Équipements et étiquettes QR</h2><span class="small muted">Téléchargez l’étiquette et collez-la sur l’équipement.</span>
    ${S.equip.map(e => `<div class="card" style="display:flex;gap:12px;align-items:flex-start"><img class="qr" src="${qrUrl(e.code)}" alt="QR code de ${esc(e.nom)}"><div class="stack-s" style="flex:1;min-width:0"><strong>${esc(e.nom)} <span class="badge lv-info">${esc(e.code)}</span></strong><span class="tiny muted">${esc(e.zone || '')}${e.exemple ? ' · exemple' : ''}</span>
     <div class="chips">${downloads ? `<button class="btn sm" data-act="eq-dl" data-v="${esc(e.code)}">Étiquette PNG</button>` : ''}<button class="btn sm" data-act="eq-edit" data-v="${esc(e.code)}">Modifier</button><button class="btn sm" data-act="eq-del" data-v="${esc(e.code)}" style="${ui.confirmDel === e.code ? 'background:var(--danger);color:var(--danger-on);border-color:var(--danger)' : ''}">${ui.confirmDel === e.code ? 'Confirmer la suppression' : 'Supprimer'}</button></div></div></div>`).join('') || '<div class="card empty">Aucun équipement.</div>'}</div>${accountSection()}`;
 }
};

/* ---------- Fragments ---------- */
function stopSign(s) { return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><polygon points="20,2 44,2 62,20 62,44 44,62 20,62 2,44 2,20" fill="#D92D20" stroke="#FFFFFF" stroke-width="3"/><text x="32" y="38" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF">STOP</text></svg>`; }
function presentView() {
  const n = SLIDES.length, i = Math.min(ui.slide, n - 1);
  return `<div class="present" role="dialog" aria-label="Mode présentation"><img src="${SLIDES[i].img}" alt="Diapositive ${i + 1} : ${esc(SLIDES[i].title)}"><button class="zone" style="left:0" data-act="slide-prev" aria-label="Précédente"></button><button class="zone" style="right:0" data-act="pres-next" aria-label="Suivante"></button>
   <div class="bar2"><button data-act="slide-prev" ${i === 0 ? 'disabled' : ''} aria-label="Précédente">←</button><span>${i + 1} / ${n}</span><button data-act="pres-next" ${i === n - 1 ? 'disabled' : ''} aria-label="Suivante">→</button><button data-act="present-close">Fermer</button></div></div>`;
}
function quizView(myForm) {
  const r = ui.quizResult;
  return `${backLink('#accueil', 'Quiz : droit d’arrêt', QUIZ.length + ' questions · ' + QUIZ_PASS + ' bonnes réponses pour valider')}
   ${myForm && !r ? `<div class="note ok small">Formation déjà validée le ${esc(dmy(myForm.at))}. Vous pouvez repasser le quiz.</div>` : ''}
   ${r ? `<div class="note ${r.ok ? 'ok' : 'warn'}" role="status"><strong>${r.score} / ${QUIZ.length}</strong> · ${r.ok ? 'Formation validée. Elle est enregistrée et visible par le service HSE.' : 'Pas encore validée : revoyez les explications ci-dessous et recommencez.'}</div>` : ''}
   ${QUIZ.map((q, k) => {
     const a = ui.quiz[k];
     return `<div class="card stack-s"><strong class="small">${k + 1}. ${esc(q.q)}</strong><div class="stack-s">${q.o.map((o, j) => {
       let st = '';
       if (r) st = j === q.a ? 'border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink)' : (a === j ? 'border-color:var(--danger);background:var(--danger-soft);color:var(--danger-ink)' : '');
       return `<button class="chip" style="white-space:normal;text-align:left;min-height:44px;padding:8px 14px;border-radius:12px;${st}" aria-pressed="${a === j}" data-act="quiz-pick" data-k="${k}" data-v="${j}" ${r ? 'disabled' : ''}>${esc(o)}</button>`;
     }).join('')}</div>${r ? `<span class="tiny muted">${esc(q.why)}</span>` : ''}</div>`;
   }).join('')}
   ${ui.quizErr ? `<div class="note err small">${esc(ui.quizErr)}</div>` : ''}
   ${r ? `<div class="grid2"><button class="btn" data-act="quiz-reset">Recommencer</button><button class="btn primary" data-act="slide-go" data-v="0">Revoir les diapositives</button></div>` : `<button class="btn primary block" data-act="quiz-submit">Valider mes réponses</button><button class="btn ghost" data-act="slide-go" data-v="${SLIDES.length - 1}">← Retour aux diapositives</button>`}`;
}
function stopCard(s) {
  const step = s.step || 1, closed = s.status === 'clos', notes = ui.stopNotes[s.id] || '', showLog = ui.stopLog === s.id;
  return `<div class="card stack-s">
   <div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:0 0 auto">${stopSign(34)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><strong class="small">${esc(s.motif || 'Arrêt de travail')}</strong><span class="tiny muted">${esc(s.lieu || 'Lieu non précisé')} · ${esc(dmy(s.at))} ${esc(hhmm(s.at))} · <span data-uid="${esc(s.by || '')}">…</span></span></span><span class="badge ${closed ? 'lv-done' : step >= 5 ? 'lv-low' : 'lv-high'}">${closed ? 'Clos' : step >= 5 ? 'Travail repris' : 'Arrêté'}</span></div>
   ${s.desc ? `<span class="small">${esc(s.desc)}</span>` : ''}
   <div class="tracker" aria-label="Étapes du droit d’arrêt">${STOP_S.map((l, k) => `<span class="${k < step ? 'done' : (k === step && !closed ? 'next' : '')}"><i>${k < step ? '✓' : k + 1}</i>${esc(l)}</span>`).join('')}</div>
   ${!closed ? `<div class="field"><label for="sn-${esc(s.id)}" class="small">Étape ${step + 1} · ${esc(STOP_S[step])} : commentaire (facultatif)</label><input class="input" id="sn-${esc(s.id)}" data-stopnote="${esc(s.id)}" value="${esc(notes)}" placeholder="${step === 2 ? 'Ex. : cause identifiée, égout non obturé' : step === 3 ? 'Ex. : égout obturé, zone inspectée par le HSE' : step === 4 ? 'Ex. : situation sûre pour tous, reprise à 10 h' : 'Ex. : retour d’expérience partagé en causerie'}"></div>
    <button class="btn ${step === 4 ? 'ok' : 'primary'}" data-act="stop-next" data-id="${esc(s.id)}">Valider : ${esc(STOP_S[step])}</button>` : ''}
   ${(s.log || []).length ? `<button class="btn ghost sm" data-act="stop-log" data-id="${esc(s.id)}" aria-expanded="${showLog}">${showLog ? 'Masquer' : 'Voir'} l’historique (${s.log.length})</button>${showLog ? `<ol>${s.log.map(e => `<li class="small"><strong>${esc(STOP_S[e.step - 1] || '')}</strong> · ${esc(dmy(e.at))} ${esc(hhmm(e.at))} · <span data-uid="${esc(e.by || '')}">…</span>${e.note ? ' · ' + esc(e.note) : ''}</li>`).join('')}</ol>` : ''}` : ''}

async function compress(file, max = 1100, q = 0.72) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}

/* Scanner */
async function decodeQr(file) {
  ui.scanBusy = true; ui.scanMsg = ''; render(true);
  try {
    if (typeof jsQR !== 'function') throw new Error('lib');
    let found = null;
    for (const size of [1200, 800, 1600]) {
      const c = await compress(file, size, 1);
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height);
      const r = jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
      if (r && r.data) { found = r.data; break; }
    }
    ui.scanBusy = false;
    if (!found) { ui.scanMsg = 'Aucun QR code lisible sur la photo. Rapprochez-vous et évitez les reflets, ou saisissez le code.'; return render(true); }
    const code = found.replace(/^VIGIE:/i, '').trim().toUpperCase();
    return openEquip(code);
  } catch { ui.scanBusy = false; ui.scanMsg = 'La lecture du QR code a échoué. Saisissez le code de l’équipement.'; render(true); }
}
function openEquip(code) {
  if (!code) { ui.scanMsg = 'Saisissez un code.'; return render(true); }
  const e = S.equip.find(x => x.code.toUpperCase() === code.toUpperCase());
  ui.sheet = e ? e.code : code; ui.scanMsg = '';
  if (e) { lastEquip = { code: e.code, nom: e.nom }; lsSet('vigie.lastEquip', lastEquip); }
  render(true); window.scrollTo(0, 0);
}

function makeSupaDB(client) {
  const cache = {}, listeners = {}, loading = {};

      async set(o) { const v = JSON.parse(JSON.stringify(o)); const { error } = await client.from('docs').upsert({ collection: c, id, data: v, updated_at: new Date().toISOString() }); if (error) fail(error); local(c, id, v); },
      async update(o) {

}

  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch {}
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.value = 0.08; o.start(); setTimeout(() => { o.stop(); ac.close(); }, 900); } catch {}
  if ('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker) {
    navigator.serviceWorker.ready.then(r => r.showNotification('Alerte SOS : ' + t.label, { body: (x.equipName || x.lieu || 'Position non précisée') + ' · ouvrez Vigie', tag: 'sos-' + x.id, requireInteraction: true, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', data: { url: './index.html' } })).catch(() => {});

let started = false;
function startApp() {
  if (started) return; started = true;
  const docs = s => s.docs.map(x => Object.assign({ id: x.id }, x.data()));
  db.doc('config/site').onSnapshot(s => { S.cfg = s.exists ? s.data() : {}; render(); });
  db.collection('risks').onSnapshot(s => { S.risks = docs(s); render(); });
  db.collection('incidents').orderBy('at', 'desc').limit(200).onSnapshot(s => { S.incidents = docs(s); render(); });
  db.collection('sos').orderBy('at', 'desc').limit(30).onSnapshot(s => {
    S.sos = docs(s);
    const recent = Date.now() - 3600e3;
    if (seenSos) S.sos.filter(x => x.status === 'active' && !seenSos.has(x.id) && x.by !== S.me.id && new Date(x.at).getTime() > recent).forEach(notifySos);
    seenSos = new Set(S.sos.map(x => x.id));
    render();
  });
  db.collection('permits').orderBy('at', 'desc').limit(100).onSnapshot(s => { S.permits = docs(s); render(); });
  db.collection('stops').orderBy('at', 'desc').limit(100).onSnapshot(s => { S.stops = docs(s); render(); });
  db.collection('formation').onSnapshot(s => { S.formation = docs(s); render(); });

}

  if (error) { AUTH.need = true; AUTH.step = 'pending'; AUTH.msg = 'Connexion à la base impossible. Vérifiez le réseau, puis réessayez.'; return render(true); }
  AUTH.profile = prof;
  if (!prof || !prof.nom) { AUTH.need = true; AUTH.step = 'name'; return render(true); }
  if (!prof.active) { AUTH.need = true; AUTH.step = 'pending'; return render(true); }
  AUTH.need = false;
  db = makeSupaDB(sb); user = makeSupaUser(sb); assets = null; sample = null; downloads = localDownloads;
  S.me = { id: uid, name: prof.nom }; S.canEdit = prof.role === 'hse'; S.dbState = 'ready';
  startApp();
}
async function authSend() {
  const email = (($('#authEmail') || {}).value || AUTH.email).trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { AUTH.msg = 'Adresse e-mail invalide.'; return render(true); }
  AUTH.email = email; AUTH.busy = true; AUTH.msg = ''; render(true);
  const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
  AUTH.busy = false;
  if (error) { AUTH.msg = /rate|limit|seconds/i.test(error.message) ? 'Trop de demandes : patientez une minute avant de redemander un code.' : 'Envoi du code impossible : ' + error.message; return render(true); }
  AUTH.step = 'code'; AUTH.msg = 'Code envoyé. Regardez votre boîte mail (et les indésirables).'; render(true);
}
async function authVerify() {
  const token = (($('#authCode') || {}).value || '').replace(/\s/g, '');
  if (!/^\d{6,10}$/.test(token)) { AUTH.msg = 'Saisissez le code à chiffres reçu par e-mail.'; return render(true); }
  AUTH.busy = true; AUTH.msg = ''; render(true);
  const { data, error } = await sb.auth.verifyOtp({ email: AUTH.email, token, type: 'email' });
  AUTH.busy = false;
  if (error || !data.session) { AUTH.msg = 'Code incorrect ou expiré. Demandez un nouveau code.'; return render(true); }
  afterLogin(data.session);
}
async function authName() {
  const nom = (($('#authNom') || {}).value || '').trim();
  if (nom.length < 2) { AUTH.msg = 'Indiquez votre prénom et votre nom.'; return render(true); }
  AUTH.busy = true; render(true);
  const uid = AUTH.session.user.id;
  const { data, error } = await sb.from('profiles').update({ nom }).eq('id', uid).select('id');
  if (error || !data || !data.length) { AUTH.busy = false; AUTH.msg = 'Enregistrement du nom impossible. Le script de base de données a-t-il bien été exécuté ?'; return render(true); }
  afterLogin(AUTH.session);
}
async function loadUsers() {
  if (AUTH.usersLoading) return; AUTH.usersLoading = true;
  const { data } = await sb.from('profiles').select('id,nom,email,role,active,created_at').order('created_at', { ascending: true });
  AUTH.users = data || []; AUTH.usersLoading = false; render();
}
async function setMember(id, active, role) {
  const { error } = await sb.rpc('set_member', { target: id, p_active: active, p_role: role });
  if (error) { AUTH.msg = 'Modification refusée : ' + error.message; }
  AUTH.users = null; loadUsers();
}
function fBadge(uid) { const f = S.formation.find(x => x.id === uid); return f ? `<span class="tiny" style="color:var(--ok-ink)">Formation droit d’arrêt validée le ${esc(dmy(f.at))}</span>` : '<span class="tiny muted">Formation droit d’arrêt à faire</span>'; }
function accountSection() {
  if (!SUPA || !AUTH.profile) return '';
  const p = AUTH.profile;
  let h = `<div class="card stack-s"><h2>Mon compte</h2><span class="small">${esc(p.nom)} · ${esc(p.email || (AUTH.session && AUTH.session.user.email) || '')}</span><span class="tiny muted">Rôle : ${p.role === 'hse' ? 'service HSE' : 'opérateur'}</span><button class="btn" data-act="logout">Se déconnecter</button></div>`;
  if (S.canEdit) {
    if (AUTH.users === null) setTimeout(loadUsers, 0);
    const us = AUTH.users || [];
    const pend = us.filter(u => !u.active);
    h += `<div class="stack-s"><h2>Utilisateurs</h2><span class="small muted">Validez chaque nouveau compte avant qu’il voie les données du site.</span>${AUTH.msg ? `<div class="note err small">${esc(AUTH.msg)}</div>` : ''}
      <div class="card flush list">${AUTH.users === null ? '<div class="empty">Chargement…</div>' : us.map(u => `<div class="row" style="flex-wrap:wrap"><span class="grow"><strong>${esc(u.nom || 'Sans nom')}</strong><span class="tiny muted">${esc(u.email || '')}</span>${fBadge(u.id)}</span>
        <span class="badge ${u.active ? (u.role === 'hse' ? 'lv-info' : 'lv-low') : 'lv-high'}">${u.active ? (u.role === 'hse' ? 'HSE' : 'Opérateur') : 'En attente'}</span>
        ${u.id === S.me.id ? '' : `<span class="chips" style="width:100%">${u.active ? `<button class="btn sm" data-act="member" data-id="${esc(u.id)}" data-active="0" data-role="${esc(u.role)}">Désactiver</button><button class="btn sm" data-act="member" data-id="${esc(u.id)}" data-active="1" data-role="${u.role === 'hse' ? 'operateur' : 'hse'}">${u.role === 'hse' ? 'Passer opérateur' : 'Passer HSE'}</button>` : `<button class="btn sm ok" data-act="member" data-id="${esc(u.id)}" data-active="1" data-role="operateur">Valider</button>`}</span>`}</div>`).join('')}</div>
      ${pend.length ? `<span class="tiny muted">${pend.length} compte(s) en attente.</span>` : ''}</div>`;
  }
  return h;
}
function authView() {
  const A = AUTH;
  const msg = A.msg ? `<div class="note ${/impossible|incorrect|invalide|refus|Trop/.test(A.msg) ? 'err' : 'info'} small" role="status">${esc(A.msg)}</div>` : '';
  let body = '';
  if (A.step === 'email') body = `<div class="field"><label for="authEmail">Adresse e-mail</label><input class="input" id="authEmail" type="email" autocomplete="email" inputmode="email" value="${esc(A.email)}" placeholder="prenom.nom@entreprise.fr"></div>${msg}<button class="btn primary block" data-act="auth-send" ${A.busy ? 'disabled' : ''}>${A.busy ? 'Envoi…' : 'Recevoir mon code de connexion'}</button>`;
  else if (A.step === 'code') body = `<span class="small">Code envoyé à <strong>${esc(A.email)}</strong></span><div class="field"><label for="authCode">Code reçu par e-mail</label><input class="input" id="authCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" style="font-size:22px;letter-spacing:.2em;font-variant-numeric:tabular-nums"></div>${msg}<button class="btn primary block" data-act="auth-verify" ${A.busy ? 'disabled' : ''}>${A.busy ? 'Vérification…' : 'Se connecter'}</button><div class="chips"><button class="btn ghost sm" data-act="auth-send">Renvoyer un code</button><button class="btn ghost sm" data-act="auth-back">Changer d’adresse</button></div>`;
  else if (A.step === 'name') body = `<span class="small">Première connexion : comment vous appelez-vous ? Votre nom apparaît sur vos déclarations et vos alertes.</span><div class="field"><label for="authNom">Prénom et nom</label><input class="input" id="authNom" autocomplete="name" placeholder="Ex. : Karim Benali"></div>${msg}<button class="btn primary block" data-act="auth-name" ${A.busy ? 'disabled' : ''}>Continuer</button>`;
  else body = `<div class="note warn">Votre compte est en attente de validation par le service HSE. Prévenez votre responsable sécurité, puis réessayez.</div>${msg}<button class="btn primary block" data-act="auth-refresh">J’ai été validé, réessayer</button><button class="btn ghost" data-act="logout">Se déconnecter</button>`;
  return `<div class="stack-s" style="padding-top:12px"><h1>Connexion à Vigie</h1><span class="small muted">Accès réservé au personnel du site et aux entreprises intervenantes.</span></div>
   <div class="card stack">${body}</div>
   <div class="stack-s"><h2>Urgence ?</h2><span class="small muted">Pas besoin de vous connecter pour appeler.</span>${numbersCard()}</div>`;
}

(async () => {
  if (!SUPA) {
    db = makeLocalDB(); user = null; assets = null; sample = null; downloads = localDownloads;
    S.me = { id: 'local' }; S.canEdit = true; S.dbState = 'ready';
    return startApp();
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  if (/error_description|error_code/.test(location.hash)) { AUTH.msg = 'Ce lien de connexion a expiré ou a déjà servi. Demandez un nouveau code ci-dessous.'; try { history.replaceState(null, '', location.pathname); } catch {} }
  AUTH.need = true; AUTH.step = 'email'; render(true);
  const { data } = await sb.auth.getSession();
  if (data && data.session) await afterLogin(data.session); else render(true);
})();
})();
</script>
